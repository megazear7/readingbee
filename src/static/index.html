<!doctype html>
<html lang="en">
  <head>
    <title>Reading Bee</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta charset="UTF-8" />
    <link rel="preload" href="/fonts/nunito-400.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/nunito-700.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/lexend-500.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="stylesheet" type="text/css" href="/app.css" />
    <style>
      html:not(.fonts-ready) reading-bee-app {
        visibility: hidden;
      }
    </style>
    <script>
      (function () {
        var finished = false;
        var done = function () {
          if (finished) return;
          finished = true;
          document.documentElement.classList.add("fonts-ready");
        };
        setTimeout(done, 1500);
        if (!document.fonts || !document.fonts.load) {
          done();
          return;
        }
        Promise.all([
          document.fonts.load("400 16px Nunito"),
          document.fonts.load("700 16px Nunito"),
          document.fonts.load("500 16px Lexend"),
        ]).then(done, done);
      })();
    </script>
    <script type="module" src="/bundle.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" });
      }
    </script>
    <meta name="description" content="Reading Bee helps beginner readers learn to read." />
    <link rel="icon" type="image/png" href="/logo/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0c0b09" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Reading Bee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reading Bee" />
    <link rel="apple-touch-icon" href="/logo/logo-256x256.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/logo/logo-512x512.png" />
    <meta name="msapplication-TileImage" content="/logo/logo-512x512.png" />
    <meta name="msapplication-TileColor" content="#0c0b09" />
    <meta name="twitter:card" content="summary" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Reading Bee" />
    <meta property="og:site_name" content="Reading Bee" />
    <meta property="og:description" content="Reading Bee helps beginner readers learn to read." />
    <meta property="og:image" content="/logo/logo-512x512.png" />
  </head>
  <body>
    <reading-bee-app></reading-bee-app>
  </body>
</html>
